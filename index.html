   \"name\": \"Education Pro \u0995\u09c0 \u098f\u09ac\u0982 \u098f\u099f\u09bf \u0995\u09be\u09a6\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u0989\u09aa\u09af\u09cb\u0997\u09c0?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Education Pro \u09b9\u09b2\u09cb \u098f\u0995\u099f\u09bf \u09b8\u09ae\u09a8\u09cd\u09ac\u09bf\u09a4 \u0993 \u09b8\u09cd\u09ae\u09be\u09b0\u09cd\u099f \u098f\u09a1\u09c1\u0995\u09c7\u09b6\u09a8 \u09ae\u09cd\u09af\u09be\u09a8\u09c7\u099c\u09ae\u09c7\u09a8\u09cd\u099f \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u0964 \u098f\u099f\u09bf \u09ac\u09bf\u09b6\u09c7\u09b7 \u0995\u09b0\u09c7 \u0995\u09cb\u099a\u09bf\u0982 \u09b8\u09c7\u09a8\u09cd\u099f\u09be\u09b0, \u09b8\u09cd\u0995\u09c1\u09b2, \u0995\u09b2\u09c7\u099c, \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982 \u0987\u09a8\u09b8\u09cd\u099f\u09bf\u099f\u09bf\u0989\u099f \u098f\u09ac\u0982 \u09ae\u09be\u09b2\u09cd\u099f\u09bf-\u09ac\u09cd\u09b0\u09be\u099e\u09cd\u099a \u09b6\u09bf\u0995\u09cd\u09b7\u09be \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09a6\u09c8\u09a8\u09a8\u09cd\u09a6\u09bf\u09a8 \u09aa\u09cd\u09b0\u09b6\u09be\u09b8\u09a8\u09bf\u0995, \u0985\u09cd\u09af\u09be\u0995\u09be\u09a1\u09c7\u09ae\u09bf\u0995 \u0993 \u0986\u09b0\u09cd\u09a5\u09bf\u0995 \u0995\u09be\u09b0\u09cd\u09af\u0995\u09cd\u09b0\u09ae \u09b8\u09b9\u099c\u09c7 \u09aa\u09b0\u09bf\u099a\u09be\u09b2\u09a8\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Education Pro \u09ae\u09cb\u09ac\u09be\u0987\u09b2 \u09a5\u09c7\u0995\u09c7 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7 \u0995\u09bf?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u09b9\u09cd\u09af\u09be\u0981, \u0985\u09ac\u09b6\u09cd\u09af\u0987! \u098f\u099f\u09bf \u0995\u09ae\u09cd\u09aa\u09bf\u0989\u099f\u09be\u09b0 \u0993 \u09ae\u09cb\u09ac\u09be\u0987\u09b2 \u09af\u09c7\u0995\u09cb\u09a8\u09cb \u09a1\u09bf\u09ad\u09be\u0987\u09b8 \u09a5\u09c7\u0995\u09c7 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u09af\u09cb\u0997\u09cd\u09af\u0964 Education Pro \u098f\u09b0 \u09b8\u09be\u09a5\u09c7 \u09a5\u09be\u0995\u099b\u09c7 \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ac\u09bf\u09a8\u09be\u09ae\u09c2\u09b2\u09cd\u09af\u09c7 \u0995\u09ae\u09a8 \u0985\u09cd\u09af\u09be\u09aa\u09b8\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u09a6\u09bf\u09af\u09bc\u09c7 OMR \u09b8\u09cd\u0995\u09cd\u09af\u09be\u09a8\u09bf\u0982 \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u0995\u09be\u099c \u0995\u09b0\u09c7?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Education Pro-\u098f\u09b0 \u0985\u09a8\u09a8\u09cd\u09af \u09ab\u09bf\u099a\u09be\u09b0 \u09b9\u09b2\u09cb \u098f\u09b0 \u09ae\u09cb\u09ac\u09be\u0987\u09b2 \u0985\u09cd\u09af\u09be\u09aa\u09ad\u09bf\u09a4\u09cd\u09a4\u09bf\u0995 OMR \u0987\u09ad\u09cd\u09af\u09be\u09b2\u09c1\u09af\u09bc\u09c7\u09b6\u09a8\u0964 \u0995\u09cb\u09a8\u09cb \u09a6\u09be\u09ae\u09bf \u09ac\u09be \u09ad\u09be\u09b0\u09c0 OMR \u09ae\u09c7\u09b6\u09bf\u09a8 \u099b\u09be\u09a1\u09bc\u09be\u0987 \u0986\u09aa\u09a8\u09be\u09b0 \u09b9\u09be\u09a4\u09c7\u09b0 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09b8\u09cd\u09ae\u09be\u09b0\u09cd\u099f\u09ab\u09cb\u09a8\u09c7\u09b0 \u0995\u09cd\u09af\u09be\u09ae\u09c7\u09b0\u09be \u09a6\u09bf\u09af\u09bc\u09c7 OMR \u09b6\u09bf\u099f \u09b8\u09cd\u0995\u09cd\u09af\u09be\u09a8 \u0995\u09b0\u09c7 \u09b8\u09c7\u0995\u09c7\u09a8\u09cd\u09a1\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7\u0987 \u09b6\u09a4\u09ad\u09be\u0997 \u09a8\u09bf\u0996\u09c1\u0981\u09a4 \u09b0\u09c7\u099c\u09be\u09b2\u09cd\u099f \u0993 \u09ae\u09c7\u09b0\u09bf\u099f \u09b2\u09bf\u09b8\u09cd\u099f \u09aa\u09cd\u09b0\u09b8\u09c7\u09b8 \u0995\u09b0\u09be \u09af\u09be\u09af\u09bc\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u0985\u09a8\u09b2\u09be\u0987\u09a8 \u0993 \u0985\u09ab\u09b2\u09be\u0987\u09a8 \u0989\u09ad\u09af\u09bc \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u09ad\u09b0\u09cd\u09a4\u09bf \u0993 \u09ab\u09bf \u0995\u09be\u09b2\u09c7\u0995\u09b6\u09a8 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u09b9\u09cd\u09af\u09be\u0981\u0964 \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f\u09a6\u09c7\u09b0 \u0985\u09a8\u09b2\u09be\u0987\u09a8 \u0993 \u0985\u09ab\u09b2\u09be\u0987\u09a8 \u09ad\u09b0\u09cd\u09a4\u09bf, \u09ab\u09bf \u0997\u09cd\u09b0\u09b9\u09a3 (\u0995\u09cd\u09af\u09be\u09b6/\u09ac\u09bf\u0995\u09be\u09b6/\u0995\u09be\u09b0\u09cd\u09a1), \u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2 \u09ae\u09be\u09a8\u09bf \u09b0\u09bf\u09b8\u09bf\u099f \u09aa\u09cd\u09b0\u09a6\u09be\u09a8 \u098f\u09ac\u0982 \u09ac\u0995\u09c7\u09af\u09bc\u09be (Due) \u09ab\u09bf \u09b8\u0982\u0995\u09cd\u09b0\u09be\u09a8\u09cd\u09a4 \u0985\u099f\u09cb\u09ae\u09c7\u099f\u09c7\u09a1 \u098f\u09b8\u098f\u09ae\u098f\u09b8 \u09a8\u09cb\u099f\u09bf\u09ab\u09bf\u0995\u09c7\u09b6\u09a8 \u09aa\u09be\u09a0\u09be\u09a8\u09cb\u09b0 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be \u09b0\u09af\u09bc\u09c7\u099b\u09c7\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09a8\u09bf\u09af\u09bc\u09ae \u0985\u09a8\u09c1\u09af\u09be\u09af\u09bc\u09c0 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u0995\u09be\u09b8\u09cd\u099f\u09ae\u09be\u0987\u099c \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7 \u0995\u09bf?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u0985\u09ac\u09b6\u09cd\u09af\u0987\u0964 \u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u0987\u0989\u09a8\u09bf\u0995 \u0995\u09cb\u09b0\u09cd\u09b8 \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u09a8, \u09ab\u09bf \u09b8\u09cd\u099f\u09cd\u09b0\u09be\u0995\u099a\u09be\u09b0, \u09ac\u09cd\u09af\u09be\u099a \u09ae\u09cd\u09af\u09be\u09a8\u09c7\u099c\u09ae\u09c7\u09a8\u09cd\u099f \u0993 \u0995\u09be\u099c\u09c7\u09b0 \u09a7\u09b0\u09a8\u09c7\u09b0 \u0993\u09aa\u09b0 \u09ad\u09bf\u09a4\u09cd\u09a4\u09bf \u0995\u09b0\u09c7 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u0995\u09be\u09b8\u09cd\u099f\u09ae\u09be\u0987\u099c \u0995\u09b0\u09be\u09b0 \u09b8\u09c1\u09ac\u09bf\u09a7\u09be \u09b0\u09af\u09bc\u09c7\u099b\u09c7\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0 \u09b8\u09c7\u099f\u0986\u09aa \u098f\u09ac\u0982 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09cd\u099f\u09be\u09ab\u09a6\u09c7\u09b0 \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982\u09af\u09bc\u09c7\u09b0 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be \u0986\u099b\u09c7 \u0995\u09bf?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u09b9\u09cd\u09af\u09be\u0981\u0964 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09a1\u09c7\u09a1\u09bf\u0995\u09c7\u099f\u09c7\u09a1 \u09b8\u09be\u09aa\u09cb\u09b0\u09cd\u099f \u099f\u09bf\u09ae \u09aa\u09cd\u09b0\u09be\u09a5\u09ae\u09bf\u0995 \u09b8\u09c7\u099f\u0986\u09aa, \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09a1\u09c7\u099f\u09be \u09aa\u09cd\u09b0\u09b8\u09c7\u09b8 \u098f\u09ac\u0982 \u0986\u09aa\u09a8\u09be\u09b0 \u099f\u09bf\u09ae\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b8\u09a6\u09b8\u09cd\u09af\u0995\u09c7 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ab\u09cd\u09b0\u09bf \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982 \u09aa\u09cd\u09b0\u09a6\u09be\u09a8 \u0995\u09b0\u09ac\u09c7\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09ac\u09be \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f\u09a6\u09c7\u09b0 \u09a1\u09c7\u099f\u09be \u0995\u09bf \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u09c7 \u0987\u09ae\u09cd\u09aa\u09cb\u09b0\u09cd\u099f \u09ac\u09be \u09ae\u09be\u0987\u0997\u09cd\u09b0\u09c7\u099f \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u09b9\u09cd\u09af\u09be\u0981, \u0996\u09c1\u09ac \u09b8\u09b9\u099c\u09c7\u0987 \u098f\u0995\u09cd\u09b8\u09c7\u09b2 (Excel) \u09ab\u09be\u0987\u09b2 \u09a5\u09c7\u0995\u09c7 \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f \u09a1\u09c7\u099f\u09be \u098f\u09ac\u0982 \u09ae\u09be\u09b0\u09cd\u0995\u09b8 \u0986\u09aa\u09b2\u09cb\u09a1 \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7\u0964 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u099f\u09c7\u0995\u09a8\u09bf\u0995\u09cd\u09af\u09be\u09b2 \u099f\u09bf\u09ae \u0986\u09aa\u09a8\u09be\u0995\u09c7 \u098f\u0987 \u09a1\u09c7\u099f\u09be \u09ae\u09be\u0987\u0997\u09cd\u09b0\u09c7\u09b6\u09a8\u09c7 \u09aa\u09c2\u09b0\u09cd\u09a3 \u09b8\u09b9\u09be\u09af\u09bc\u09a4\u09be \u0995\u09b0\u09ac\u09c7\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09a1\u09c7\u099f\u09be \u0995\u09a4\u099f\u09be \u09a8\u09bf\u09b0\u09be\u09aa\u09a6 \u09a5\u09be\u0995\u09ac\u09c7?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09b8\u09cd\u09aa\u09b0\u09cd\u09b6\u0995\u09be\u09a4\u09b0 \u09b8\u09ac \u09a4\u09a5\u09cd\u09af \u09b6\u09a4\u09ad\u09be\u0997 \u09b8\u09c1\u09b0\u0995\u09cd\u09b7\u09bf\u09a4 \u09b0\u09be\u0996\u09a4\u09c7 \u0986\u09ae\u09b0\u09be \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09bf \u09ac\u09cd\u09af\u09be\u0982\u0995\u09bf\u0982-\u0997\u09cd\u09b0\u09c7\u09a1 \u09b8\u09bf\u0995\u09bf\u0989\u09b0\u09bf\u099f\u09bf \u09aa\u09cd\u09b0\u09af\u09c1\u0995\u09cd\u09a4\u09bf\u0964 \u09ab\u09b2\u09c7 \u09a1\u09c7\u099f\u09be \u09b9\u09be\u09b0\u09be\u09a8\u09cb \u09ac\u09be \u09ab\u09be\u09b8 \u09b9\u0993\u09af\u09bc\u09be\u09b0 \u0995\u09cb\u09a8\u09cb \u09b8\u09c1\u09af\u09cb\u0997 \u09a8\u09c7\u0987\u0964\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"\u0995\u09c0\u09ad\u09be\u09ac\u09c7 Education Pro-\u098f\u09b0 \u098f\u0995\u099f\u09bf \u09ab\u09cd\u09b0\u09bf \u09a1\u09c7\u09ae\u09cb \u09a6\u09c7\u0996\u09a4\u09c7 \u09aa\u09be\u09b0\u09bf?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"\u0993\u09af\u09bc\u09c7\u09ac\u09b8\u09be\u0987\u099f\u09c7\u09b0 \u2018\u09ab\u09cd\u09b0\u09bf \u09b2\u09be\u0987\u09ad \u09a1\u09c7\u09ae\u09cb \u09ac\u09c1\u0995 \u0995\u09b0\u09c1\u09a8\u2019 \u09ab\u09b0\u09cd\u09ae\u09c7 \u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09a4\u09a5\u09cd\u09af \u09a6\u09bf\u09af\u09bc\u09c7 \u09b8\u09be\u09ac\u09ae\u09bf\u099f \u0995\u09b0\u09b2\u09c7\u0987 \u09e8\u09ea \u0998\u09a3\u09cd\u099f\u09be\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b0\u09bf\u09aa\u09cd\u09b0\u09c7\u099c\u09c7\u09a8\u09cd\u099f\u09c7\u099f\u09bf\u09ad \u0986\u09aa\u09a8\u09be\u09b0 \u09b8\u09be\u09a5\u09c7 \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997 \u0995\u09b0\u09c7 \u09b8\u09c1\u09ac\u09bf\u09a7\u09be\u099c\u09a8\u0995 \u09b8\u09ae\u09af\u09bc\u09c7 \u09a1\u09c7\u09ae\u09cb \u09b8\u09c7\u09b6\u09a px;\n      }\n\n      @media (min-width: 901px) {\n        aspect-ratio: 1;\n      }\n\n      @media (min-width: 1025px) {\n        box-shadow: 0 2px 6px hsl(var(--title-6) / .05), 0 28px 56px -32px hsl(var(--title-6) / .3);\n      }\n    }\n\n    .dash {\n      display: block;\n      width: 100%;\n      height: 100%;\n\n      text {\n        font-family: \"Hind Siliguri\", \"Noto Sans Bengali\", system-ui, sans-serif;\n      }\n    }\n\n    .d-bg {\n      fill: var(--color-background);\n    }\n\n    .d-side {\n      fill: var(--color-title-2);\n    }\n\n    .d-pill {\n      fill: hsl(var(--primary-foreground) / .09);\n    }\n\n    .d-on {\n      fill: var(--color-primary-foreground);\n    }\n\n    .d-dim {\n      fill: var(--color-muted-foreground-5);\n    }\n\n    .d-card {\n      fill: var(--color-card);\n      stroke: var(--color-muted);\n      stroke-width: 1;\n    }\n\n    .d-ink {\n      fill: var(--color-title);\n    }\n\n    .d-soft {\n      fill: var(--color-foreground-2);\n    }\n\n    .d-faint {\n      fill: var(--color-muted-foreground);\n    }\n\n    .d-accent {\n      fill: var(--color-secondary);\n    }\n\n    .d-primary {\n      fill: var(--color-primary);\n    }\n\n    .d-chip {\n      fill: var(--color-accent);\n    }\n\n    .d-track {\n      fill: var(--color-muted);\n    }\n\n    .d-bar {\n      fill: var(--color-border);\n    }\n\n    .d-grid {\n      stroke: var(--color-muted);\n      stroke-dasharray: 3 4;\n    }\n\n    .d-line {\n      stroke: var(--color-muted);\n    }\n\n    .d-icon {\n      fill: none;\n      stroke: currentColor;\n      stroke-width: 1.5;\n      stroke-linecap: round;\n      stroke-linejoin: round;\n      color: var(--color-muted-foreground-5);\n    }\n\n    .d-icon-on {\n      color: var(--color-secondary);\n    }\n\n    .d-serif {\n      font-family: \"Noto Serif Bengali\", \"Hind Siliguri\", Georgia, serif;\n    }\n\n    .d-bold {\n      font-weight: 600;\n    }\n\n    .scan-card {\n      position: relative;\n      width: 100%;\n      margin-top: -38px;\n      padding: 14px;\n      border: 1px solid var(--color-muted);\n      border-radius: 20px;\n      background: var(--color-card);\n      box-shadow: 0 2px 6px hsl(var(--title-6) / .05), 0 28px 56px -32px hsl(var(--title-6) / .3);\n\n      @media (min-width: 641px) {\n        position: absolute;\n        right: 0;\n        bottom: 0;\n        width: min(288px, 80%);\n        margin-top: 0;\n      }\n\n      @media (min-width: 1025px) {\n        left: -46px;\n        right: auto;\n      }\n    }\n\n    .scan-bar {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      margin-bottom: 12px;\n      color: var(--color-title);\n\n      .icon {\n        width: 16px;\n        height: 16px;\n      }\n    }\n\n    .scan-title {\n      margin-right: auto;\n      font-size: 14px;\n      font-weight: 600;\n    }\n\n    .scan-dot {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--color-secondary);\n      box-shadow: 0 0 0 0 hsl(var(--secondary) / .5);\n      animation: ping 2.4s infinite;\n    }\n\n    .scan-view {\n      display: grid;\n      place-items: center;\n      padding: 18px;\n      border-radius: 14px;\n      background: var(--color-title-4);\n    }\n\n    .scan-sheet {\n      position: relative;\n      display: grid;\n      gap: 8px;\n      padding: 12px 14px;\n      border-radius: 4px;\n      background:\n      linear-gradient(var(--color-title-2) 0 0) left 4px top 4px / 6px 6px no-repeat,\n      linear-gradient(var(--color-title-2) 0 0) right 4px top 4px / 6px 6px no-repeat,\n      linear-gradient(var(--color-title-2) 0 0) left 4px bottom 4px / 6px 6px no-repeat,\n      linear-gradient(var(--color-title-2) 0 0) right 4px bottom 4px / 6px 6px no-repeat,\n      var(--color-primary-foreground);\n    }\n\n    .scan-head, .scan-row {\n      display: grid;\n      grid-template-columns: 20px repeat(4, 14px) 12px;\n      align-items: center;\n      justify-items: center;\n      column-gap: 6px;\n      font-size: 14px;\n      font-weight: 600;\n      line-height: 1;\n      color: var(--color-muted-foreground-3);\n    }\n\n    .scan-row {\n      --r: 0;\n\n      i {\n        width: 14px;\n        height: 14px;\n        border: 1.5px solid var(--color-foreground-3);\n        border-radius: 50%;\n        transition: box-shadow .15s linear;\n      }\n\n      .m {\n        border-color: var(--color-title-2);\n        background: var(--color-title-2);\n      }\n\n      .icon {\n        width: 12px;\n        height: 12px;\n        stroke-width: 2.5;\n        color: var(--color-title-2);\n        opacity: 0;\n        transition: opacity .15s linear;\n      }\n\n      .bad {\n        color: var(--color-danger);\n      }\n    }\n\n    .scan-beam {\n      position: absolute;\n      top: 0;\n      left: -8px;\n      right: -8px;\n      height: 2px;\n      border-radius: 2px;\n      background: var(--color-secondary);\n      opacity: 0;\n      box-shadow: 0 0 14px 2px hsl(var(--secondary) / .5);\n    }\n\n    .scan-result {\n      display: grid;\n      margin-top: 12px;\n      font-size: 14px;\n      color: var(--color-foreground-2);\n\n      span {\n        display: flex;\n        grid-area: 1 / 1;\n        align-items: baseline;\n        justify-content: space-between;\n        gap: 8px;\n        transition: opacity .2s linear;\n      }\n\n      b {\n        font-family: \"Noto Serif Bengali\", \"Hind Siliguri\", Georgia, serif;\n        font-size: 20px;\n        font-weight: 600;\n        line-height: 1;\n        color: var(--color-title);\n      }\n    }\n\n    .scan-done {\n      opacity: 0;\n    }\n\n    @media (min-width: 641px) {\n      padding: 144px 0 72px;\n    }\n\n    @media (min-width: 1025px) {\n      padding: 176px 0 104px;\n    }\n  }\n\n  .hero-section .hero-shot::after {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    border-radius: inherit;\n    box-shadow: inset 0 0 0 1px hsl(var(--title) / .05);\n  }\n\n  .hero-section .scan-sheet::before {\n    content: \"\";\n    position: absolute;\n    inset: -8px;\n    pointer-events: none;\n    background:\n    linear-gradient(var(--color-secondary) 0 0) left top / 14px 2px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) left top / 2px 14px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) right top / 14px 2px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) right top / 2px 14px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) left bottom / 14px 2px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) left bottom / 2px 14px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) right bottom / 14px 2px no-repeat,\n    linear-gradient(var(--color-secondary) 0 0) right bottom / 2px 14px no-repeat;\n  }\n\n  .hero-section .scan-card.scanned .scan-beam {\n    animation: sweep 1.6s linear .1s 1;\n  }\n\n  /* the moment the sweep crosses row --r: sheet 126px, rows 22px apart, 1.6s linear after .1s */\n  .hero-section .scan-card.scanned .scan-row .m {\n    box-shadow: 0 0 0 2px var(--color-primary-foreground), 0 0 0 4px var(--color-title-2);\n    transition-delay: calc(565ms + var(--r, 0) * 255ms);\n  }\n\n  .hero-section .scan-card.scanned .scan-row .m.bad {\n    box-shadow: 0 0 0 2px var(--color-primary-foreground), 0 0 0 4px var(--color-danger);\n  }\n\n  .hero-section .scan-card.scanned .scan-row .icon {\n    opacity: 1;\n    transition-delay: calc(565ms + var(--r, 0) * 255ms);\n  }\n\n  .hero-section .scan-card.scanned .scan-wait {\n    opacity: 0;\n    transition-delay: 1.7s;\n  }\n\n  .hero-section .scan-card.scanned .scan-done {\n    opacity: 1;\n    transition-delay: 1.7s;\n  }\n\n  @keyframes ping {\n    0% {\n      box-shadow: 0 0 0 0 hsl(var(--secondary) / .45);\n    }\n\n    70% {\n      box-shadow: 0 0 0 9px hsl(var(--secondary) / 0);\n    }\n\n    100% {\n      box-shadow: 0 0 0 0 hsl(var(--secondary) / 0);\n    }\n  }\n\n  @keyframes sweep {\n    0% {\n      opacity: 1;\ \u09b0\u09c7\u09a1\u09bf\u0982, \u09ae\u09c7\u09b0\u09bf\u099f \u09b2\u09bf\u09b8\u09cd\u099f \u0993 \u09b0\u09bf\u09aa\u09cb\u09b0\u09cd\u099f \u0995\u09be\u09b0\u09cd\u09a1 \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09c7 \u09a6\u09cd\u09b0\u09c1\u09a4 \u09b0\u09c7\u099c\u09be\u09b2\u09cd\u099f \u09aa\u09cd\u09b0\u09b8\u09cd\u09a4\u09c1\u09a4 \u0993 \u0985\u09ad\u09bf\u09ad\u09be\u09ac\u0995\u09a6\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u09aa\u09be\u09a0\u09be\u09a8\u0964<\/p>\n      <\/li>\n      <li class=\"benefit-item\" data-anim>\n        <h3>\u0987\u09a8\u09ad\u09c7\u09a8\u09cd\u099f\u09b0\u09bf \u0993 \u098f\u0995\u09cd\u09b8\u09aa\u09c7\u09a8\u09cd\u09b8 \u099f\u09cd\u09b0\u09cd\u09af\u09be\u0995\u09be\u09b0<\/h3>\n        <p>\u0995\u09cb\u099a\u09bf\u0982\u09af\u09bc\u09c7\u09b0 \u0986\u09af\u09bc-\u09ac\u09cd\u09af\u09af\u09bc \u098f\u09ac\u0982 \u09ac\u0987, \u09b2\u09c7\u0995\u099a\u09be\u09b0 \u09b6\u09bf\u099f \u09ac\u09be \u0985\u09a8\u09cd\u09af\u09be\u09a8\u09cd\u09af \u09b8\u09be\u09ae\u0997\u09cd\u09b0\u09c0\u09b0 \u09b9\u09bf\u09b8\u09be\u09ac \u09b0\u09be\u0996\u09c1\u09a8 \u098f\u09ac\u0982 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u0986\u09b0\u09cd\u09a5\u09bf\u0995 \u0985\u09aa\u099a\u09af\u09bc \u09ac\u09a8\u09cd\u09a7 \u0995\u09b0\u09c1\u09a8\u0964<\/p>\n      <\/li>\n      <li class=\"benefit-item\" data-anim>\n        <h3>\u0985\u09cd\u09af\u09be\u09a1\u09ad\u09be\u09a8\u09cd\u09b8\u09a1 \u0985\u09cd\u09af\u09be\u09a8\u09be\u09b2\u09bf\u099f\u09bf\u0995\u09cd\u09b8 \u0993 \u09b0\u09bf\u09aa\u09cb\u09b0\u09cd\u099f\u09b8<\/h3>\n        <p>\u09ad\u09bf\u099c\u09cd\u09af\u09c1\u09af\u09bc\u09be\u09b2 \u0997\u09cd\u09b0\u09be\u09ab \u0993 \u099a\u09be\u09b0\u09cd\u099f\u09c7 \u09b2\u09be\u09ad-\u0995\u09cd\u09b7\u09a4\u09bf \u0993 \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0\u09a6\u09c7\u09b0 \u09aa\u09be\u09b0\u09ab\u09b0\u09ae\u09cd\u09af\u09be\u09a8\u09cd\u09b8 \u09ac\u09bf\u09b6\u09cd\u09b2\u09c7 0px;\n      }\n\n      @media (min-width: 1025px) {\n        grid-template-columns: repeat(12, minmax(0, 1fr));\n        padding-bottom: 48px;\n      }\n    }\n\n    .unique-grid {\n      display: grid;\n      grid-template-columns: 1fr;\n\n      @media (min-width: 641px) {\n        grid-template-columns: repeat(2, 1fr);\n      }\n\n      @media (min-width: 1025px) {\n        grid-template-columns: repeat(4, 1fr);\n      }\n    }\n\n    .unique-item {\n      padding: 24px 0;\n      border-bottom: 1px solid var(--color-border-2);\n      transition: opacity .5s cubic-bezier(.22, 1, .36, 1), transform .5s cubic-bezier(.22, 1, .36, 1), background-color .35s cubic-bezier(.22, 1, .36, 1);\n      transition-delay: calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms), 0s;\n\n      &:hover {\n        @media (min-width: 1025px) {\n          background: var(--color-title-3);\n        }\n      }\n\n      h3 {\n        margin-bottom: 12px;\n        font-size: 20px;\n\n        @media (min-width: 641px) {\n          margin-bottom: 16px;\n          font-size: 22px;\n        }\n\n        @media (min-width: 1025px) {\n          font-size: 26px;\n        }\n      }\n\n      p {\n        color: var(--color-muted-foreground-6);\n      }\n\n      @media (min-width: 641px) {\n        display: grid;\n        grid-row: span 2;\n        grid-template-rows: subgrid;\n        row-gap: 0;\n        padding: 32px 24px;\n        border-right: 1px solid var(--color-border-2);\n      }\n\n      @media (min-width: 1025px) {\n        padding: 40px 32px;\n        transition-duration: .7s, .7s, .35s;\n      }\n    }\n\n    @media (min-width: 641px) {\n      padding: 72px 0;\n    }\n\n    @media (min-width: 1025px) {\n      padding: 104px 0;\n    }\n  }\n\n  .unique-section .unique-item:nth-child(odd) {\n    @media (min-width: 641px) {\n      padding-left: 0;\n    }\n\n    @media (min-width: 1025px) {\n      padding-left: 32px;\n    }\n  }\n\n  .unique-section .unique-item:nth-child(2n) {\n    @media (min-width: 641px) {\n      padding-right: 0;\n      border-right: 0;\n    }\n\n    @media (min-width: 1025px) {\n      padding-right: 32px;\n      border-right: 1px solid var(--color-border-2);\n    }\n  }\n\n  .unique-section .unique-item:nth-child(4n) {\n    @media (min-width: 1025px) {\n      border-right: 0;\n    }\n  }\n\n  .unique-section .unique-item:nth-child(n+7) {\n    @media (min-width: 641px) {\n      border-bottom: 0;\n    }\n  }\n\n  .unique-section .unique-item:nth-child(n+5) {\n    @media (min-width: 1025px) {\n      border-bottom: 0;\n    }\n  }\n\n  .unique-section .unique-item:last-child {\n    border-bottom: 0;\n  }\n\n  .unique-section .section-title .highlight {\n    color: var(--color-secondary);\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .unique-section .unique-item {\n      transition: none;\n    }\n  }\n<\/style>\n\n<section class=\"unique-section\" id=\"unique\">\n  <div class=\"container\">\n    <div class=\"unique-head\">\n      <h2 class=\"section-title\" data-anim>\u0995\u09c7\u09a8 \u0986\u09ae\u09b0\u09be <span class=\"highlight\">\u0985\u09a8\u09a8\u09cd\u09af<\/span>?<\/h2>\n      <p class=\"lede\" data-anim style=\"--i:1\">\n        \u0986\u09aa\u09a8\u09be\u09b0 \u09b6\u09bf\u0995\u09cd\u09b7\u09be \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09a6\u09c8\u09a8\u09a8\u09cd\u09a6\u09bf\u09a8 \u09aa\u09cd\u09b0\u09b6\u09be\u09b8\u09a8\u09bf\u0995 \u099c\u099f\u09bf\u09b2\u09a4\u09be\u09b0 \u09e7\u09e6\u09e6% \u0995\u09be\u09b0\u09cd\u09af\u0995\u09b0 \u09b8\u09ae\u09be\u09a7\u09be\u09a8\u0964\n      <\/p>\n    <\/div>\n\n    <div class=\"unique-grid\">\n      <div class=\"unique-item\" data-anim><h3>\u0985\u09b2-&NoBreak;\u0987\u09a8-&NoBreak;\u0993\u09af\u09bc\u09be\u09a8 \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u099f\u09ab\u09b0\u09cd\u09ae<\/h3><p>\u0985\u09cd\u09af\u09be\u09a1\u09ae\u09bf\u09b6\u09a8, \u09ab\u09bf, \u0985\u09cd\u09af\u09be\u099f\u09c7\u09a8\u09a1\u09c7\u09a8\u09cd\u09b8, \u098f\u0995\u09cd\u09b8\u09be\u09ae \u0993 \u09b9\u09bf\u09b8\u09be\u09ac&NoBreak;\u2014 \u098f\u0995 \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u099f\u09ab\u09b0\u09cd\u09ae\u09c7\u0987 \u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09af\u09be\u09ac\u09a4\u09c0\u09af\u09bc \u0995\u09be\u09b0\u09cd\u09af\u0995\u09cd\u09b0\u09ae\u0964<\/p><\/div>\n      <div class=\"unique-item\" data-anim style=\"--i:1\"><h3>\u09b6\u09bf\u0995\u09cd\u09b7\u09be \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09ac\u09be\u09b8\u09cd\u09a4\u09ac \u0995\u09be\u099c\u09c7\u09b0 \u0989\u09aa\u09af\u09cb\u0997\u09c0<\/h3><p>\u0995\u09cb\u099a\u09bf\u0982 \u09b8\u09c7\u09a8\u09cd\u099f\u09be\u09b0, \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982 \u0987\u09a8\u09b8\u09cd\u099f\u09bf\u099f\u09bf\u0989\u099f \u0993 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09ac\u09be\u09b8\u09cd\u09a4\u09ac \u09a6\u09c8\u09a8\u09a8\u09cd\u09a6\u09bf\u09a8 \u099a\u09cd\u09af\u09be\u09b2\u09c7\u099e\u09cd\u099c \u0993 \u0995\u09be\u099c\u09c7\u09b0 \u09a7\u09b0\u09a3 \u09aa\u09b0\u09cd\u09af\u09ac\u09c7\u0995\u09cd\u09b7\u09a3 \u0995\u09b0\u09c7\u0987 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ab\u09bf\u099a\u09be\u09b0\u0997\u09c1\u09b2\u09cb \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964<\/p><\/div>\n      <div class=\"unique-item\" data-anim style=\"--i:2\"><h3>\u09b8\u09b9\u099c \u0993 \u0987\u0989\u099c\u09be\u09b0-\u09ab\u09cd\u09b0\u09c7\u09a8\u09cd\u09a1\u09b2\u09bf<\/h3><p>\u098f\u09b0 \u09b8\u09b9\u099c \u0993 \u0987\u0989\u099c\u09be\u09b0-\u09ab\u09cd\u09b0\u09c7\u09a8\u09cd\u09a1\u09b2\u09bf \u0987\u09a8\u09cd\u099f\u09be\u09b0\u09ab\u09c7\u09b8\u09c7\u09b0 \u0995\u09be\u09b0\u09a3\u09c7 \u099c\u099f\u09bf\u09b2 \u099f\u09c7\u0995\u09a8\u09bf\u0995\u09cd\u09af\u09be\u09b2 \u099c\u09cd\u099e\u09be\u09a8 \u099b\u09be\u09a1\u09bc\u09be\u0987 \u0996\u09c1\u09ac \u0 u09af\u09be\u099f\u09b8\">\n  <div class=\"container stats-grid\">\n    <div class=\"stat-item\" data-anim><b>\u09e8\u09e6<sup>+<\/sup><\/b><span>\u09b6\u09bf\u0995\u09cd\u09b7\u09be \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8<\/span><\/div>\n    <div class=\"stat-item\" data-anim style=\"--i:1\"><b>\u09eb,\u09e6\u09e6\u09e6<sup>+<\/sup><\/b><span>\u09b8\u0995\u09cd\u09b0\u09bf\u09af\u09bc \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0<\/span><\/div>\n    <div class=\"stat-item\" data-anim style=\"--i:2\"><b>\u09e8,\u09ed\u09eb,\u09ec\u09eb\u09ea<sup>+<\/sup><\/b><span>OMR \u09b6\u09bf\u099f \u09ae\u09c2\u09b2\u09cd\u09af\u09be\u09af\u09bc\u09a8<\/span><\/div>\n    <div class=\"stat-item\" data-anim style=\"--i:3\"><b>\u09ef\u09ec<sup>%<\/sup><\/b><span>\u0995\u09be\u09b8\u09cd\u099f\u09ae\u09be\u09b0 \u09b8\u09cd\u09af\u09be\u099f\u09bf\u09b8\u09ab\u09cd\u09af\u09be\u0995\u09b6\u09a8<\/span><\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     08 \u00b7 DEMO REQUEST / CONTACT \u2014 \u09ef \u09ab\u09bf\u09b2\u09cd\u09a1\u09c7\u09b0 \u09ab\u09b0\u09cd\u09ae\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<style>\n  /* Demo request */\n  .demo-section {\n    background: linear-gradient(180deg, var(--color-background-3), var(--color-background));\n    padding: 48px 0;\n\n    .demo-grid {\n      display: grid;\n      gap: 32px;\n      align-items: start;\n      grid-template-columns: 1fr;\n\n      @media (min-width: 641px) {\n        gap: 48px;\n      }\n\n      @media (min-width: 901px) {\n        column-gap: 24px;\n        grid-template-columns: repeat(12, minmax(0, 1fr));\n      }\n\n      @media (min-width: 1025px) {\n        column-gap: 32px;\n      }\n    }\n\n    .demo-intro {\n      top: 104px;\n      position: static;\n\n      @media (min-width: 901px) {\n        grid-column: span 5;\n      }\n\n      @media (min-width: 1025px) {\n        position: sticky;\n      }\n    }\n\n    .form {\n      padding: 20px;\n      border: 1px solid var(--color-border);\n      border-radius: 20px;\n      background: var(--color-card);\n      box-shadow: 0 1px 2px hsl(var(--title-6) / .04);\n\n      @media (min-width: 641px) {\n        padding: 24px;\n        border-radius: 24px;\n      }\n\n      @media (min-width: 901px) {\n        grid-column: 7 / span 6;\n      }\n\n      @media (min-width: 1025px) {\n        padding: 40px;\n        box-shadow: 0 1px 2px hsl(var(--title-6) / .04), 0 8px 20px -14px hsl(var(--title-6) / .22);\n      }\n    }\n\n    .form-grid {\n      display: grid;\n      gap: 16px;\n      grid-template-columns: 1fr;\n\n      @media (min-width: 641px) {\n        grid-template-columns: 1fr 1fr;\n        gap: 24px;\n      }\n\n      @media (min-width: 1025px) {\n        gap: 32px;\n      }\n    }\n\n    .field {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n\n      &.field-span {\n        grid-column: 1 / -1;\n      }\n\n      label {\n        font-size: 14px;\n        font-weight: 600;\n        color: var(--color-title);\n      }\n\n      label i {\n        font-style: normal;\n        color: var(--color-danger);\n      }\n\n      input {\n        width: 100%;\n        padding: 12px 16px;\n        border: 1px solid var(--color-input);\n        border-radius: 12px;\n        background: var(--color-card-2);\n        font-family: \"Hind Siliguri\", \"Noto Sans Bengali\", system-ui, -apple-system, sans-serif;\n        font-size: 16px;\n        transition: .22s;\n      }\n\n      input:focus {\n        outline: 0;\n        border-color: var(--color-title);\n        background: var(--color-card);\n        box-shadow: 0 0 0 3px hsl(var(--title) / .06);\n      }\n\n      .field-hint {\n        font-size: 14px;\n        color: var(--color-foreground-2);\n      }\n\n      small {\n        display: none;\n        font-size: 14px;\n        color: var(--color-danger);\n      }\n    }\n\n    .form-foot {\n      display: flex;\n      flex-wrap: wrap;\n      align-items: center;\n      justify-content: space-between;\n      gap: 16px;\n      margin-top: 24px;\n      padding-top: 24px;\n      border-top: 1px solid var(--color-muted);\n\n      .btn {\n        width: 100%;\n        justify-content: center;\n\n        @media (min-width: 641px) {\n          width: auto;\n        }\n      }\n\n      @media (min-width: 641px) {\n        gap: 24px;\n        margin-top: 32px;\n        padding-top: 32px;\n      }\n    }\n\n    .form-privacy {\n      display: flex;\n      align-items: flex-start;\n      gap: 8px;\n      max-width: 38ch;\n      font-size: 14px;\n      color: var(--color-foreground-2);\n\n      .icon {\n        margin-top: calc((1lh - 20px) / 2);\n\n        @media (min-width: 1025px) {\n          margin-top: calc((1lh - 24px) / 2);\n        }\n      }\n    }\n\n    .done-state {\n      display: none;\n      padding: 24px 12px;\n      text-align: center;\n\n      &.show {\n        display: block;\n        animation: drop .45s cubic-bezier(.22, 1, .36, 1);\n      }\n\n      .tick {\n        display: grid;\n        place-items: center;\n        width: 56px;\n        height: 56px;\n        margin: 0 auto 20px;\n        border-radius: 50%;\n        background: var(--color-accent);\n        color: var(--color-primary);\n\n        @media (min-width: 641px) {\n          margin-bottom: 24px;\n        }\n      }\n\n      h3 {\n        margin-bottom: 12px;\n        font-size: 20px;\n\n        @media (min-width: 641px) {\n          margin-bottom: 16px;\n          font-size: 22px;\n        }\n\n        @media (min-width: 1025px) {\n          font-size: 26px;\n        }\n      }\n\n      p {\n        max-width: 44ch;\n        margin-inline: auto;\n        color: var(--color-foreground-2);\n      }\n\n      @media (min-width: 641px) {\n        padding: 32px 24px;\n      }\n\n      @media (min-width: 1025px) {\n        padding: 48px 24px;\n      }\n    }\n\n    @media (min-width: 641px) {\n      padding: 72px 0;\n    }\n\n    @media (min-width: 1025px) {\n      padding: 104px 0;\n    }\n  }\n\n  .demo-section .field.error input {\n    border-color: var(--color-primary);\n    background: var(--color-card-3);\n  }\n\n  .demo-section .field.error small {\n    display: block;\n  }\n\n  .demo-section .field.error .field-hint {\n    display: none;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .demo-section .done-state.show {\n      animation: none;\n    }\n  }\n<\/style>\n\n<section class=\"demo-section\" id=\"demo\">\n  <div class=\"container demo-grid\">\n\n    <div class=\"demo-intro\">\n      <h2 class=\"section-title\" data-anim>\u09b2\u09be\u0987\u09ad <span class=\"highlight\">\u09a1\u09c7\u09ae\u09cb<\/span> \u09ac\u09c1\u0995 \u0995\u09b0\u09c1\u09a8<\/h2>\n      <p class=\"lede\" data-anim style=\"--i:1\">\n        \u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09aa\u09cd\u09b0\u09b6\u09be\u09b8\u09a8\u09bf\u0995 \u0995\u09be\u09b0\u09cd\u09af\u0995\u09cd\u09b0\u09ae\u0995\u09c7 \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2, \u09a6\u09cd\u09b0\u09c1\u09a4 \u0993 \u099d\u09be\u09ae\u09c7\u09b2\u09be\u09ae\u09c1\u0995\u09cd\u09a4 \u0995\u09b0\u09a4\u09 u09a4\u09bf\u0995 OMR \u0987\u09ad\u09cd\u09af\u09be\u09b2\u09c1\u09af\u09bc\u09c7\u09b6\u09a8\u0964 \u0995\u09cb\u09a8\u09cb \u09a6\u09be\u09ae\u09bf \u09ac\u09be \u09ad\u09be\u09b0\u09c0 OMR \u09ae\u09c7\u09b6\u09bf\u09a8 \u099b\u09be\u09a1\u09bc\u09be\u0987 \u0986\u09aa\u09a8\u09be\u09b0 \u09b9\u09be\u09a4\u09c7\u09b0 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09b8\u09cd\u09ae\u09be\u09b0\u09cd\u099f\u09ab\u09cb\u09a8\u09c7\u09b0 \u0995\u09cd\u09af\u09be\u09ae\u09c7\u09b0\u09be \u09a6\u09bf\u09af\u09bc\u09c7 OMR \u09b6\u09bf\u099f \u09b8\u09cd\u0995\u09cd\u09af\u09be\u09a8 \u0995\u09b0\u09c7 \u09b8\u09c7\u0995\u09c7\u09a8\u09cd\u09a1\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7\u0987 \u09b6\u09a4\u09ad\u09be\u0997 \u09a8\u09bf\u0996\u09c1\u0981\u09a4 \u09b0\u09c7\u099c\u09be\u09b2\u09cd\u099f \u0993 \u09ae\u09c7\u09b0\u09bf\u099f \u09b2\u09bf\u09b8\u09cd\u099f \u09aa\u09cd\u09b0\u09b8\u09c7\u09b8 \u0995\u09b0\u09be \u09af\u09be\u09af\u09bc\u0964<\/p><\/div><\/div>\n      <\/div>\n\n      <div class=\"faq-item\">\n        <button class=\"faq-question\" aria-expanded=\"false\">\n          \u0985\u09a8\u09b2\u09be\u0987\u09a8 \u0993 \u0985\u09ab\u09b2\u09be\u0987\u09a8 \u0989\u09ad\u09af\u09bc \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u09ad\u09b0\u09cd\u09a4\u09bf \u0993 \u09ab\u09bf \u0995\u09be\u09b2\u09c7\u0995\u09b6\u09a8 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac?\n          <span class=\"faq-icon\"><svg class=\"icon\"><use href=\"#i-chev\"/><\/svg><\/span>\n        <\/button>\n        <div class=\"faq-answer\"><div><p>\u09b9\u09cd\u09af\u09be\u0981\u0964 \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f\u09a6\u09c7\u09b0 \u0985\u09a8\u09b2\u09be\u0987\u09a8 \u0993 \u0985\u09ab\u09b2\u09be\u0987\u09a8 \u09ad\u09b0\u09cd\u09a4\u09bf, \u09ab\u09bf \u0997\u09cd\u09b0\u09b9\u09a3 (\u0995\u09cd\u09af\u09be\u09b6/\u09ac\u09bf\u0995\u09be\u09b6/\u0995\u09be\u09b0\u09cd\u09a1), \u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2 \u09ae\u09be\u09a8\u09bf \u09b0\u09bf\u09b8\u09bf\u099f \u09aa\u09cd\u09b0\u09a6\u09be\u09a8 \u098f\u09ac\u0982 \u09ac\u0995\u09c7\u09af\u09bc\u09be (Due) \u09ab\u09bf \u09b8\u0982\u0995\u09cd\u09b0\u09be\u09a8\u09cd\u09a4 \u0985\u099f\u09cb\u09ae\u09c7\u099f\u09c7\u09a1 \u098f\u09b8\u098f\u09ae\u098f\u09b8 \u09a8\u09cb\u099f\u09bf\u09ab\u09bf\u0995\u09c7\u09b6\u09a8 \u09aa\u09be\u09a0\u09be\u09a8\u09cb\u09b0 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be \u09b0\u09af\u09bc\u09c7\u099b\u09c7\u0964<\/p><\/div><\/div>\n      <\/div>\n\n      <div class=\"faq-item\">\n        <button class=\"faq-question\" aria-expanded=\"false\">\n          \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09a8\u09bf\u09af\u09bc\u09ae \u0985\u09a8\u09c1\u09af\u09be\u09af\u09bc\u09c0 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u0995\u09be\u09b8\u09cd\u099f\u09ae\u09be\u0987\u099c \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7 \u0995\u09bf?\n          <span class=\"faq-icon\"><svg class=\"icon\"><use href=\"#i-chev\"/><\/svg><\/span>\n        <\/button>\n        <div class=\"faq-answer\"><div><p>\u0985\u09ac\u09b6\u09cd\u09af\u0987\u0964 \u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u0987\u0989\u09a8\u09bf\u0995 \u0995\u09cb\u09b0\u09cd\u09b8 \u09aa\u09cd\u09b2\u09cd\u09af\u09be\u09a8, \u09ab\u09bf \u09b8\u09cd\u099f\u09cd\u09b0\u09be\u0995\u099a\u09be\u09b0, \u09ac\u09cd\u09af\u09be\u099a \u09ae\u09cd\u09af\u09be\u09a8\u09c7\u099c\u09ae\u09c7\u09a8\u09cd\u099f \u0993 \u0995\u09be\u099c\u09c7\u09b0 \u09a7\u09b0\u09a8\u09c7\u09b0 \u0993\u09aa\u09b0 \u09ad\u09bf\u09a4\u09cd\u09a4\u09bf \u0995\u09b0\u09c7 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u0995\u09be\u09b8\u09cd\u099f\u09ae\u09be\u0987\u099c \u0995\u09b0\u09be\u09b0 \u09b8\u09c1\u09ac\u09bf\u09a7\u09be \u09b0\u09af\u09bc\u09c7\u099b\u09c7\u0964<\/p><\/div><\/div>\n      <\/div>\n\n      <div class=\"faq-item\">\n        <button class=\"faq-question\" aria-expanded=\"false\">\n          \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0 \u09b8\u09c7\u099f\u0986\u09aa \u098f\u09ac\u0982 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09cd\u099f\u09be\u09ab\u09a6\u09c7\u09b0 \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982\u09af\u09bc\u09c7\u09b0 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be \u0986\u099b\u09c7 \u0995\u09bf?\n          <span class=\"faq-icon\"><svg class=\"icon\"><use href=\"#i-chev\"/><\/svg><\/span>\n        <\/button>\n        <div class=\"faq-answer\"><div><p>\u09b9\u09cd\u09af\u09be\u0981\u0964 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09a1\u09c7\u09a1\u09bf\u0995\u09c7\u099f\u09c7\u09a1 \u09b8\u09be\u09aa\u09cb\u09b0\u09cd\u099f \u099f\u09bf\u09ae \u09aa\u09cd\u09b0\u09be\u09a5\u09ae\u09bf\u0995 \u09b8\u09c7\u099f\u0986\u09aa, \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09a1\u09c7\u099f\u09be \u09aa\u09cd\u09b0\u09b8\u09c7\u09b8 \u098f\u09ac\u0982 \u0986\u09aa\u09a8\u09be\u09b0 \u099f\u09bf\u09ae\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b8\u09a6\u09b8\u09cd\u09af\u0995\u09c7 \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u099f\u09bf \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ab\u09cd\u09b0\u09bf \u099f\u09cd\u09b0\u09c7\u09a8\u09bf\u0982 \u09aa\u09cd\u09b0\u09a6\u09be\u09a8 \u0995\u09b0\u09ac\u09c7\u0964<\/p><\/div><\/div>\n      <\/div>\n\n      <div class=\"faq-item\">\n        <button class=\"faq-question\" aria-expanded=\"false\">\n          \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09ac\u09be \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f\u09a6\u09c7\u09b0 \u09a1\u09c7\u099f\u09be \u0995\u09bf \u09b8\u09ab\u099f\u0993\u09af\u09bc\u09cd\u09af\u09be\u09b0\u09c7 \u0987\u09ae\u09cd\u09aa\u09cb\u09b0\u09cd\u099f \u09ac\u09be \u09ae\u09be\u0987\u0997\u09cd\u09b0\u09c7\u099f \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7?\n          <span class=\"faq-icon\"><svg class=\"icon\"><use href=\"#i-chev\"/><\/svg><\/span>\n        <\/button>\n        <div class=\"faq-answer\"><div><p>\u09b9\u09cd\u09af\u09be\u0981, \u0996\u09c1\u09ac \u09b8\u09b9\u099c\u09c7\u0987 \u098f\u0995\u09cd\u09b8\u09c7\u09b2 (Excel) \u09ab\u09be\u0987\u09b2 \u09a5\u09c7\u0995\u09c7 \u09b8\u09cd\u099f\u09c1\u09a1\u09c7\u09a8\u09cd\u099f \u09a1\u09c7\u099f\u09be \u098f\u09ac\u0982 \u09ae\u09be\u09b0\u09cd\u0995\u09b8 \u0986\u09aa\u09b2\u09cb\u09a1 \u0995\u09b0\u09be \u09af\u09be\u09ac\u09c7\u0964 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u099f\u09c7\u0995\u09a8\u09bf\u0995\u09cd\u09af\u09be\u09b2 \u099f\u09bf\u09ae \u0986\u09aa\u09a8\u09be\u0995\u09c7 \u098f\u0987 \u09a1\u09c7\u099f\u09be \u09ae\u09be\u0987\u0997\u09cd\u09b0\u09c7\u09b6\u09a8\u09c7 \u09aa\u09c2\u09b0\u09cd\u09a3 \u09b8\u09b9\u09be\u09af\u09bc\u09a4\u09be \u0995\u09b0\u09ac\u09c7\u0964<\/p><\/div><\/div>\n      <\/div>\n\n      <div class=\"faq-item\">\n        <button class=\"faq-question\" aria-expanded=\"false\">\n          \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09a1\u09c7\u099f\u09be \u0995\u09a4\u099f\u09be \u09a8\u09bf\u09b0\u09be\u09aa\u09a6 \u09a5\u09be\u0995\u09ac\u09c7?\n          <span class=\"faq-icon\"><svg class=\"icon\"><use href=\"#i-chev\"/><\/svg><\/span>\n        <\/button>\n        <div class=\"faq-answer\"><div><p>\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a8\u09c7\u09b0 \u09b8\u09cd\u09aa\u09b0\u09cd\u09b6\u0995\u09be\u09a4\u09b0 \u09b8\u09ac \u09a4\u09a5\u09cd\u09af \u09b6\u09a4\u09ad\u09be\u0997 \u09b8\u09c1\u09b0\u0995\u09cd\u09b7\u09bf\u09a4 \u09b0\u09be\u0996\u09a4\u09c7 \u0986\u09ae\u09b0\u09be \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09bf \u09ac\u09cd\u09af\u09be\u0982\u0995\u09bf\u0982-\u0997\u09cd\u09b0\u09c7\u09a1 \u09b8\u09bf\u0995\u09bf\u0989\u09b0\u09bf\u099f\u09bf \u09aa\u09cd\ tElementById('burger'),\n      mnav = document.getElementById('mnav'),\n      bIcon = document.getElementById('burgerIcon');\n  function setMenu(open) {\n    mnav.classList.toggle('open', open);\n    document.body.classList.toggle('menu-open', open);\n    burger.setAttribute('aria-expanded', String(open));\n    burger.setAttribute('aria-label', open ? '\u09ae\u09c7\u09a8\u09c1 \u09ac\u09a8\u09cd\u09a7 \u0995\u09b0\u09c1\u09a8' : '\u09ae\u09c7\u09a8\u09c1 \u0996\u09c1\u09b2\u09c1\u09a8');\n    bIcon.innerHTML = '<use href=\"#' + (open ? 'i-x' : 'i-menu') + '\"/>';\n    if (open) {\n      var first = mnav.querySelector('a');\n      if (first) first.focus();\n    }\n  }\n  burger.addEventListener('click', function () { setMenu(!mnav.classList.contains('open')); });\n  mnav.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });\n  mnav.addEventListener('keydown', function (e) {\n    if (e.key !== 'Tab' || !mnav.classList.contains('open')) return;\n    var links = mnav.querySelectorAll('a');\n    var first = links[0], last = links[links.length - 1];\n    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && mnav.classList.contains('open')) { setMenu(false); burger.focus(); }\n  });\n  matchMedia('(min-width: 1025px)').addEventListener('change', function (e) {\n    if (e.matches && mnav.classList.contains('open')) setMenu(false);\n  });\n\n  /* \u2014 2.5 theme toggle: click flips, choice saved; no choice = follows OS \u2014 */\n  var themeBtn = document.getElementById('themeBtn'),\n      themeIcon = document.getElementById('themeIcon'),\n      themeMeta = document.querySelector('meta[name=\"theme-color\"]'),\n      rootEl = document.documentElement;\n  function applyTheme(dark) {\n    rootEl.classList.toggle('dark', dark);\n    themeBtn.setAttribute('aria-pressed', String(dark));\n    themeBtn.setAttribute('aria-label', dark ? '\u09b2\u09be\u0987\u099f \u09ae\u09cb\u09a1 \u099a\u09be\u09b2\u09c1 \u0995\u09b0\u09c1\u09a8' : '\u09a1\u09be\u09b0\u09cd\u0995 \u09ae\u09cb\u09a1 \u099a\u09be\u09b2\u09c1 \u0995\u09b0\u09c1\u09a8');\n    themeIcon.innerHTML = '<use href=\"#' + (dark ? 'i-sun' : 'i-moon') + '\"/>';\n    if (themeMeta) themeMeta.setAttribute('content', dark ? '#15161A' : '#F6F3ED');\n  }\n  applyTheme(rootEl.classList.contains('dark'));\n  themeBtn.addEventListener('click', function () {\n    var dark = !rootEl.classList.contains('dark');\n    applyTheme(dark);\n    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}\n  });\n  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {\n    var saved = null;\n    try { saved = localStorage.getItem('theme'); } catch (er) {}\n    if (!saved) applyTheme(e.matches);\n  });\n\n  /* \u2014 3. scroll reveal \u2014 */\n  var items = document.querySelectorAll('[data-anim]');\n  if (reduce || !('IntersectionObserver' in window)) {\n    items.forEach(function (el) { el.classList.add('in'); });\n  } else {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (en) {\n        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });\n    items.forEach(function (el) { io.observe(el); });\n  }\n\n  /* \u2014 4. OMR scanner card: the scan runs in a loop while the card is on screen\n         (sweep finds each mark, score shows, hold, reset, again) \u2014 */\n  var omr = document.getElementById('omr');\n  if (omr) {\n    if (reduce || !('IntersectionObserver' in window)) {\n      omr.classList.add('scanned');\n    } else {\n      var omrTimer = null;\n      var omrCycle = function () {\n        omr.classList.add('scanned');\n        omrTimer = setTimeout(function () {\n          omr.classList.remove('scanned');\n          omrTimer = setTimeout(omrCycle, 600);\n        }, 4200);\n      };\n      var oio = new IntersectionObserver(function (en) {\n        clearTimeout(omrTimer);\n        if (en[0].isIntersecting) {\n          omrTimer = setTimeout(omrCycle, 380);\n        } else {\n          omr.classList.remove('scanned');\n        }\n      }, { threshold: 0.5 });\n      oio.observe(omr);\n    }\n  }\n\n  /* \u2014 5. FAQ accordion (one open at a time) \u2014 */\n  document.querySelectorAll('.faq-item').forEach(function (item) {\n    var btn = item.querySelector('.faq-question');\n    btn.addEventListener('click', function () {\n      var isOpen = item.classList.contains('open');\n      document.querySelectorAll('.faq-item.open').forEach(function (o) {\n        o.classList.remove('open');\n        o.querySelector('.faq-question').setAttribute('aria-expanded', 'false');\n      });\n      if (!isOpen) { item.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }\n    });\n  });\n\n  /* \u2014 5.5 footer groups collapse into an accordion on mobile \u2014 */\n  document.querySelectorAll('.footer-toggle').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var col = btn.closest('.footer-col');\n      var open = !col.classList.contains('open');\n      col.classList.toggle('open', open);\n      btn.setAttribute('aria-expanded', String(open));\n    });\n  });\n\n  /* \u2014 6. demo form: client-side validation + success state\n         (\u0995\u09cb\u09a8\u09cb \u09ac\u09cd\u09af\u09be\u0995\u098f\u09a8\u09cd\u09a1 \u09a8\u09c7\u0987 \u2014 \u09b8\u09be\u09ac\u09ae\u09bf\u099f \u098f\u09a8\u09cd\u09a1\u09aa\u09af\u09bc\u09c7\u09a8\u09cd\u099f \u09af\u09c1\u0995\u09cd\u09a4 \u0995\u09b0\u09a4\u09c7 \u09b9\u09ac\u09c7) \u2014 */\n  var form = document.getElementById('demoForm'), ok = document.getElementById('formOk');\n  var phoneRe = /^(?:\\+?88)?01[3-9]\\d{8}$/;\n\n  /* \u09b8\u09be\u0987\u099f\u099c\u09c1\u09a1\u09bc\u09c7 \u09ac\u09be\u0982\u09b2\u09be \u09b8\u0982\u0996\u09cd\u09af\u09be \u2014 \u09ab\u09cb\u09a8\u09c7 \u09ac\u09be\u0982\u09b2\u09be \u0985\u0999\u09cd\u0995 \u099f\u09be\u0987\u09aa \u0995\u09b0\u09b2\u09c7\u0993 \u09a8\u09bf\u09a4\u09c7 \u09b9\u09ac\u09c7 */\n  function bnDigits(s) {\n    return s.replace(/[\u09e6-\u09ef]/g, function (d) { return '\u09e6\u09e7\u09e8\u09e9\u09ea\u09eb\u09ec\u09ed\u09ee\u09ef'.indexOf(d); });\n  }\n\n  function mark(field, bad) {\n    field.closest('.field').classList.toggle('error', bad);\n    return !bad;\n  }\n\n  form.addEventListener('submit', function (e) {\n    e.preventDefault();\n    var okAll = true, first = null;\n\n    ['fname', 'fdesig', 'finst', 'fstd'].forEach(function (id) {\n      var el = document.getElementById(id);\n      var good = mark(el, el.value.trim() === '');\n      if (!good) { okAll = false; first = first || el; }\n    });\n\n    var ph = document.getElementById('fphone');\n    var phVal = bnDigits(ph.value).replace(/[\\s-]/g, '');\n    if (!mark(ph, !phoneRe.test(phVal))) { okAll = false; first = first || ph; }\n\n    if (!okAll) { if (first) first.focus(); return; }\n\n    form.style.display = 'none';\n    ok.classList.add('show');\n    ok.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });\n  });\n\n  /* clear the error state as soon as the user starts fixing it */\n  form.addEventListener('input', function (e) {\n    var f = e.target.closest('.field');\n    if (f) f.classList.remove('error');\n  });\n  form.addEventListener('change', function (e) {\n    var f = e.target.closest('.field');\n    if (f) f.classList.remove('error');\n  });\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
